[project]
name = "espada"
version = "1.0.0"
description = "ESPADA either downloads data via the TAP service or uses ALMA's own data and performs source searches using SOFIA software and produces images for publication or quick inspection using SIP software."
authors = [
    { name = "Borja Montoro Molina", email = "borjamomo96@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy >= 2.1.2", 
    "pandas >= 2.2.3", 
    "pyyaml >= 6.0.2", 
    "astropy >= 6.1.4",
    "astroquery >= 0.4.8.dev9474",
    "pyvo >= 1.5.3",
    "matplotlib >= 3.9.2",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "networkx >= 3.0",
    "jinja2>=3.1.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
espada = "adplib.espada:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["adp*"]

[tool.setuptools.package-data]
"adplib" = [
    "config.yaml",
    "doc/*.yaml",
    "doc/*.pdf",
    "sip/*.yaml",
    "sofia/*.par",
    "sofia/*.fits",
    "tap/*.yaml",
]

"adpweb" = [
    "images/*",
    "resources/*",
    "templates/*",
]
