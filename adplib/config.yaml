#This is and example of the configuration file. 

###############
#   GENERAL   #
###############

#interactive: False #Future feature
quality_assesment: False
capture_outputs: False

##################
#   INPUT DATA   #
##################

input_data: ./sofia/sofia_test_datacube.fits
input_data_list: False 

###############
### LOGGING ###
###############

logger:
  level: "INFO"  # Change to INFO, WARNING, ERROR as needed
  format: "| %(levelname)s | %(module)s: - %(message)s"
  colors: True  # Activa o desactiva los colores en los logs

make_logger : False

#####################
#    TAP SERVICE    #
#####################

enable_tap_service: False
download_par_file: ./tap/download_par.yaml

#################
#     SOFIA     #
#################

enable_sofia : True 
run_mode: 'emission' #'emission', 'absorption'
abs_flag_cube: True
auto_setup: True 
sofia_abs_file : ./sofia/sofia_abs_default.par
sofia_emi_file : ./sofia/sofia_emi_default.par

#################
#      SIP      #
#################

enable_sip : False
sip_par_file : ./sip/sip_args.yaml 



