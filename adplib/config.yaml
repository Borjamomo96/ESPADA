# Configuration default file for ESPADA 

############### 
#   GENERAL   #
###############

make_report: True                  # <bool> (Default value = False) Creates a directory with an HTML report that shows a quick look at the run results.
verbose: True                       # <bool> (Default value = False) Displays through terminal the outputs from SoFiA-2 and SIP as they are executed.
num_cores: 1                       # <int> (Default value = 12) Sets the maximum number of cores that can be used to run ESPADA. The minimum number is 1, and the maximum depends on the device.
output_dir:                         # <str> (Default espada_run/) Create a directory where all products obtained during an ESPADA run will be stored. This directory overrides all other directory variables. An absolute path can also be provided, but this path must contain the value entered in 'output_dir'; otherwise, the default value will be used.

################
#    LOGGER    #
################

clear_logs: True                    # <bool> (Default value = False) Creates a directory with an HTML report that shows a quick look at the run results.
log_file: log_dir/espada.log      # <str> (Default value = 'log_dir/espada.log') Creates a subdirectory within the 'output_dir' with the final and sorted log file for the run. 

##################
#   INPUT DATA   #
##################

input_data_set: /home/usuario/ADP-ALMA-Pipeline/adplib/sofia/sofia_test_datacube.fits  # <str> | <list> (Default value = ) Path to the dataset where the pipeline will be executed, read the documentation to see examples of possible inputs.
    #1:
    #2:  
    #3: 
    #4: 

input_file: # (Default = ) Path to the input dataset file. The structure follows the same rules as for the 'input_data_set' parameter at some extend. Read the documentation to see examples of possible inputs.

#####################
#    TAP SERVICE    #
#####################

enable_tap_service: False                                                # <bool> (Default value = False) Allows you to use the 'datap' module to download datasets from the ALMA archive and run the pipeline on them.
download_par_file: ~/ADP-ALMA-Pipeline/adplib/tap/download_par.yaml      # <str>  (Default value = '~/ADP-ALMA-Pipeline/adplib/tap/download_par.yaml') Path to the path to the parameter file for download.

#################
#     SOFIA     #
#################

enable_sofia : True                                                         # <bool> (Default value = True) Allows you to use the 'sopar' module where the software SoFiA-2 is executed
run_mode: 'both' #'emission', 'absorption'                                  # <str> (Default value = 'emission') Determines the type of sources being searched and optimizes the pipeline accordingly. To search for both types, use 'both' mode.
use_mask: False                                                             # <bool> (Default value = True) Determines whether the mask either specified in 'input_data_set' or 'input_file' or available in the ALMA archive will be used when running SoFiA-2 or not.
abs_flag_cube: True                                                         # <bool> (Default value = True) Used only for run_mode: 'both'. Set the absorption sources found for 'absorption' as a flag cube for the 'emission' in SoFiA-2.
auto_setup: False                                                           # <bool> (Default value = True) Automatically optimizes certain key parameters based on data cube header information before running SoFiA-2. See documentation for more details.
sofia_abs_file : ~/ADP-ALMA-Pipeline/adplib/sofia/sofia_abs_default.par     # <str>  (Default value = '~/ADP-ALMA-Pipeline/adplib/sofia/sofia_abs_default.par') Path to the SoFiA-2 parameter file optimized to found 'absorption'.
sofia_emi_file :  ~/ADP-ALMA-Pipeline/adplib/sofia/sofia_emi_default.par    # <str>  (Default value = '~/ADP-ALMA-Pipeline/adplib/sofia/sofia_emi_default.par') Path to the SoFiA-2 parameter file optimized to found 'emission'.

#################
#      SIP      #
#################

enable_sip : True                                               # <bool> (Default value = True) Allows you to use the 'siparg' module where the software SIP is executed
sip_par_file : ~/ADP-ALMA-Pipeline/adplib/sip/sip_args.yaml     # <str>  (Default value = '~/ADP-ALMA-Pipeline/adplib/sip/sip_args.yaml ') Path to the SIP argument file.

#################
#     GROUP     #
#################

enable_group: True                                             # <bool> (Default = True) Allows you to use the 'group' module where source grouping is performed
overlap_mode :  'absflux'   # 'flux', 'absflux' or 'area'       # <str> (Default value = 'absflux') Determines the type of overlap is going to be applied to group sources.
overlap_threshold : 0.8                                         # <float> (Default value = 'emission') Set the limit applied to the 'overlap_mode' selected from 0 to 1. 
