catalog_file:                 #'-c' or '--catalog'    Catalog file. Can be the ascii file ending in .txt or the XML file from SoFiA-2.

source_id:                    #'-id' or '--source-id'.  Select certain sources, or range of sources from catalog based on the source id number. Include `0` to make summary image of all sources. Default value in ESPADA is -1 (all sources + summary).
output_image_file_type: 'png' #'-x' or '--suffix'.  Output image file type. Any file type accepted by plt.savefig() is in theory valid.  Default is 'png'.
spec_full_range: True         #'-o' or '--original'.  This allows the spectrum with noise to be plotted over the full spectral range of the original cube.
syn_beam_dimensions:          #'-b' or '--beam'.  Synthesized beam dimensions. If the primary header of the FITS files do not contain the beam information, this can be provided by the user. Accepts 1 to 3 values in order [bmaj, bmin, bpa].
channel_width:                #'cw' or 'chan-width'.  Channel width. This is only necessary if a source cubelet is not available, for example if user only has a mom0.  Channel width must then be provided in the native units of the original data cube (typically Hz or m/s.)
min_size: 0.05                #'-i' or '--image-size'.  Minimum image size (ARCMIN). Images will be square. If an HI source exceeds the requested size, a larger image to fit the HI contours will be generated. Default is 6 arcmin.
snr_range:                    #'-snr' or '--snr-range'. Specify the SNR range within which to plot the lowest HI contour. Requires 2 values. Default is [2.0, 3.0].
surveys_list: ['none']        #'-s' or '--surveys'. List of surveys on which to overlay HI contours. Only the first entry will be used in the combined image if `-m` option is used. If 'none', work in offline mode. Default is 'DSS2 Blue'.
combo: False                  #'-m' or '--imagemagick'. Make a combined image using ImageMagick.  If a path is provided after this option, it is assumed to be the path to the `convert` executable of ImageMagick. 
user_image:                   #'-ui' or '--user-image'. User supplied image for overlaying HI contours.  Can use this in combination with `-s` and a list of surveys.
percentile_range:             #'-ur' or 'user-range'. Percentile range when plotting the user supplied image.  Requires two values. Default is [10., 99.].
spec_line: 'CO(1-0)'          #'-line' or '--spectral-line'. Specify a spectral line for all sources in catalog. Default is 'HI'.  Also possible is 'CO(1-0)' up to (3-2) and 'OH_1667' and the 3 other OH lines which may fall within L-band observations. A second possibility is specifying parameters that are [molecule,rest frequency in GHz,label] such as ['CO',115,'CO(1-0)']. A line table is provided with the software in `src/data/tier1_lines_reformat.list`.
no_source_id:                 #'-noid' or '--no-source-id'. Flag to not include the source catalog id number in the title of the plots.
channel_maps:                 #'-cm' or '--chan-maps'.  Make channel maps for each source. These will be written to a multi-page pdf file in 4x5 portrait format.
spec_only:                    #'-spec' or '--spec-only'. Only make spectra, no spatial images. May be useful for multi-line sources where the moment maps are less meaningful.
plot_units:                   #'-j' or '--jy-kms'. Plot the units of the moment 0 map in Jy/beam km/s.  Only works when HI line is not requested, otherwise defaults to cm^-2 or native units.
overwrite:                    #'-ow' or '--overwrite'. Overwrite option. Will delete existing plots of the same name, if they exist before making new one.