file:
  config.yaml: |
    **Main configuration file**

    `config.yaml` controls the ESPADA workflow: input data, TAP downloads,
    SoFiA execution, SIP execution, grouping, logging, output directory, and
    report generation.

    **Format:** YAML. Each entry is written as `parameter: value`.

    **Required parameters accepted by the current Config schema**

    **GENERAL**
    - make_report
    - verbose
    - num_cores
    - output_dir

    **LOGGER**
    - clear_logs
    - log_file

    **INPUT DATA**
    - input_data_set
    - input_file

    **TAP SERVICE**
    - enable_tap_service
    - download_par_file

    **SOFIA**
    - enable_sofia
    - run_mode
    - use_mask
    - abs_flag_cube
    - auto_setup
    - sofia_abs_file
    - sofia_emi_file

    **SIP**
    - enable_sip
    - sip_par_file

    **GROUP**
    - enable_group
    - overlap_mode
    - overlap_threshold

    **Important notes**
    - Exactly one input source must be selected: TAP service, `input_data_set`,
      or `input_file`.
    - `quality_assessment` and `quality_assesment` are not valid config keys in
      the current schema. QA is currently tied to SoFiA execution.
    - Primary beam use is implicit: if a primary beam path is provided in the
      dataset tuple, ESPADA passes it to SoFiA.

    For parameter-specific help, run:
    `espada -i parameter=parameter_name`

  download_par.yaml: |
    **TAP download configuration file**

    `download_par.yaml` configures the TAP archive query and ALMA product
    download step. It is used only when `enable_tap_service: True` in
    `config.yaml`.

    **Format:** YAML. Each entry is written as `parameter: value`.

    **SERVER**
    - server_address
    - credentials
    - stored_credentials

    **QUERY**
    - query_type
    - query_par

    **Valid query_type values**
    - proposal
    - member_ous_id
    - conesearch
    - target
    - keysearch
    - free

    **query_par for each query_type**
    - proposal: proposal_id
    - member_ous_id: member_ous_id
    - conesearch: ra, dec, search_radius
    - target: sources, search_radius
    - keysearch: search_dict
    - free: query_str

    **Common query_par parameters required for every query_type**
    - point
    - public
    - published
    - print_targets
    - print_query

    **DOWNLOAD**
    - download_par
      - remove_compressed_file
      - remove_archive_mask
      - dryrun
      - print_urls
      - filename_must_include
      - data_dir

    For parameter-specific help, run:
    `espada -i parameter=parameter_name`

  sip_args.yaml: |
    **SIP argument configuration file**

    `sip_args.yaml` contains the default arguments passed to the external
    `sofia_image_pipeline` command when `enable_sip: True`.

    **Accepted parameters**
    - catalog_file
    - source_id
    - output_image_file_type
    - spec_full_range
    - syn_beam_dimensions
    - channel_width
    - min_size
    - snr_range
    - surveys_list
    - combo
    - user_image
    - percentile_range
    - spec_line
    - no_source_id
    - channel_maps
    - spec_only
    - plot_units
    - overwrite

    SIP arguments can also be passed at the end of the ESPADA command with
    `-sarg/--sip-arguments`. Because this option uses argparse REMAINDER, it
    must be the last ESPADA option.

  sofia_par: |
    **SoFiA parameter files**

    ESPADA reads SoFiA `.par` files such as `sofia_abs_default.par` and
    `sofia_emi_default.par`, then rewrites selected parameters before launching
    the external `sofia` command.

    **Pipeline-owned SoFiA parameters**
    Values for these parameters in `.par` files or `-sop` overrides are ignored
    or rewritten by ESPADA:
    - input.data
    - input.primaryBeam
    - input.mask
    - input.invert
    - pipeline.threads
    - output.directory

    ESPADA also enforces output naming and selected output products so that SIP,
    grouping, QA, and report generation can find the expected files.

parameter:
  make_report: |
    **make_report** (in config.yaml)

    - **Description:** If True, ESPADA generates an HTML and JSON report after
      the run.
    - **Type:** boolean

  verbose: |
    **verbose** (in config.yaml)

    - **Description:** If True, terminal output from external programs such as
      SoFiA and SIP is shown while they run.
    - **Type:** boolean

  num_cores: |
    **num_cores** (in config.yaml)

    - **Description:** Maximum number of CPU cores ESPADA may use. If set to
      null, ESPADA uses the available cores. SoFiA thread counts are adjusted
      from this value and the number of datasets.
    - **Type:** integer or null

  output_dir: |
    **output_dir** (in config.yaml)

    - **Description:** Directory where ESPADA writes run outputs. If null,
      ESPADA creates `espada_run/` under the current working directory.
    - **Type:** string or null

  clear_logs: |
    **clear_logs** (in config.yaml)

    - **Description:** If True, old log files matching the selected log path are
      cleared before the current run writes logs.
    - **Type:** boolean

  log_file: |
    **log_file** (in config.yaml)

    - **Description:** Path to the log file. Relative paths are resolved inside
      `output_dir`.
    - **Type:** string or null

  input_data_set: |
    **input_data_set** (in config.yaml)

    - **Description:** Local FITS dataset definition. It can contain a data cube,
      optional primary beam, optional mask, and optional ancillary/continuum
      image.
    - **Type:** string, list, dictionary, or null
    - **Examples:**
      - `input_data_set: cube.fits`
      - `input_data_set: [cube.fits, pb.fits, mask.fits]`
      - `input_data_set: [cube.fits, "", mask.fits, continuum.fits]`
      - `input_data_set: {1: cube1.fits, 2: [cube2.fits, pb2.fits]}`

    `input_data_set`, `input_file`, and `enable_tap_service` are mutually
    exclusive input modes.

  input_file: |
    **input_file** (in config.yaml)

    - **Description:** Text file containing one dataset definition per line.
      Each line follows the same order as `input_data_set`: cube, primary beam,
      mask, ancillary image.
    - **Type:** string or null

    `input_data_set`, `input_file`, and `enable_tap_service` are mutually
    exclusive input modes.

  enable_tap_service: |
    **enable_tap_service** (in config.yaml)

    - **Description:** If True, ESPADA queries/downloads ALMA archive products
      using `download_par_file`.
    - **Type:** boolean

    When this is True, `input_data_set` and `input_file` must be empty.

  download_par_file: |
    **download_par_file** (in config.yaml)

    - **Description:** Path to the TAP download configuration file. If null, the
      packaged `adplib/tap/download_par.yaml` is used.
    - **Type:** string or null

  enable_sofia: |
    **enable_sofia** (in config.yaml)

    - **Description:** If True, ESPADA runs the external SoFiA-2 command through
      the `SoPar` wrapper.
    - **Type:** boolean

  run_mode: |
    **run_mode** (in config.yaml)

    - **Description:** Source-finding mode.
    - **Type:** string
    - **Accepted values:** `emission`, `absorption`, `both`

    In `both` mode, ESPADA runs absorption first and emission second.

  use_mask: |
    **use_mask** (in config.yaml)

    - **Description:** If True and a mask is available from local input or TAP,
      ESPADA passes that mask to SoFiA as `input.mask`.
    - **Type:** boolean

  abs_flag_cube: |
    **abs_flag_cube** (in config.yaml)

    - **Description:** Used only with `run_mode: both`. If True, the absorption
      mask from the first SoFiA run is passed as a flag cube for the emission
      run.
    - **Type:** boolean

  auto_setup: |
    **auto_setup** (in config.yaml)

    - **Description:** If True, ESPADA adjusts selected SoFiA parameters from
      FITS header information before running SoFiA.
    - **Type:** boolean

  sofia_abs_file: |
    **sofia_abs_file** (in config.yaml)

    - **Description:** Path to the SoFiA `.par` file used for absorption runs.
      If null, ESPADA uses the packaged default.
    - **Type:** string or null

  sofia_emi_file: |
    **sofia_emi_file** (in config.yaml)

    - **Description:** Path to the SoFiA `.par` file used for emission runs.
      If null, ESPADA uses the packaged default.
    - **Type:** string or null

  enable_sip: |
    **enable_sip** (in config.yaml)

    - **Description:** If True, ESPADA runs the external
      `sofia_image_pipeline` command through the SIP wrapper.
    - **Type:** boolean

  sip_par_file: |
    **sip_par_file** (in config.yaml)

    - **Description:** Path to the SIP argument YAML file. If null, ESPADA uses
      the packaged `adplib/sip/sip_args.yaml`.
    - **Type:** string or null

  enable_group: |
    **enable_group** (in config.yaml)

    - **Description:** If True, ESPADA groups overlapping SoFiA detections and
      reruns SoFiA/SIP for grouped sources when possible.
    - **Type:** boolean or null

  overlap_mode: |
    **overlap_mode** (in config.yaml)

    - **Description:** Metric used by source grouping to decide whether sources
      overlap enough to be grouped.
    - **Type:** string or null
    - **Accepted values:** `area`, `flux`, `absflux`

  overlap_threshold: |
    **overlap_threshold** (in config.yaml)

    - **Description:** Threshold for grouping overlap. Values must be between 0
      and 1.
    - **Type:** float or null

  server_address: |
    **server_address** (in download_par.yaml)

    - **Description:** ALMA TAP server base URL.
    - **Type:** string
    - **Accepted values:**
      - `https://almascience.eso.org`
      - `https://almascience.nrao.edu`
      - `https://almascience.nao.ac.jp`

  credentials: |
    **credentials** (in download_par.yaml)

    - **Description:** If True, ESPADA asks the ALMA TAP client to authenticate.
    - **Type:** boolean

  stored_credentials: |
    **stored_credentials** (in download_par.yaml)

    - **Description:** If True, the ALMA client may use stored credentials.
    - **Type:** boolean

  query_type: |
    **query_type** (in download_par.yaml)

    - **Description:** Type of ALMA archive query.
    - **Type:** string
    - **Accepted values:** `proposal`, `member_ous_id`, `conesearch`,
      `target`, `keysearch`, `free`

  query_par: |
    **query_par** (in download_par.yaml)

    - **Description:** Container for query-specific parameters plus common query
      filters.
    - **Type:** mapping

    Required query-specific keys depend on `query_type`. The common keys
    `point`, `public`, `published`, `print_targets`, and `print_query` must also
    be present.

  proposal_id: |
    **proposal_id** (inside query_par)

    - **Description:** ALMA proposal identifier for `query_type: proposal`.
    - **Type:** string

  member_ous_id: |
    **member_ous_id** (inside query_par)

    - **Description:** ALMA member OUS identifier or list of identifiers for
      `query_type: member_ous_id`.
    - **Type:** string or list

  ra: |
    **ra** (inside query_par)

    - **Description:** Right ascension used by `query_type: conesearch`.
    - **Type:** integer or float

  dec: |
    **dec** (inside query_par)

    - **Description:** Declination used by `query_type: conesearch`.
    - **Type:** integer or float

  search_radius: |
    **search_radius** (inside query_par)

    - **Description:** Search radius used by `conesearch` and `target` queries.
    - **Type:** integer or float

  sources: |
    **sources** (inside query_par)

    - **Description:** Source names used by `query_type: target`.
    - **Type:** list

  search_dict: |
    **search_dict** (inside query_par)

    - **Description:** Dictionary of archive columns and match values used by
      `query_type: keysearch`.
    - **Type:** dictionary

  query_str: |
    **query_str** (inside query_par)

    - **Description:** Raw ADQL query string used by `query_type: free`.
    - **Type:** string

  point: |
    **point** (inside query_par)

    - **Description:** Common TAP query option used by the ALMA query helpers.
    - **Type:** boolean

  public: |
    **public** (inside query_par)

    - **Description:** If True, include public archive products in the query.
    - **Type:** boolean

  published: |
    **published** (inside query_par)

    - **Description:** If True, restrict query behavior to published products as
      implemented by the TAP helper.
    - **Type:** boolean

  print_targets: |
    **print_targets** (inside query_par)

    - **Description:** If True, print target information from the TAP query.
    - **Type:** boolean

  print_query: |
    **print_query** (inside query_par)

    - **Description:** If True, print the generated query.
    - **Type:** boolean

  download_par: |
    **download_par** (in download_par.yaml)

    - **Description:** Container for product download and filtering options.
    - **Type:** mapping

  remove_compressed_file: |
    **remove_compressed_file** (inside download_par)

    - **Description:** If True, remove compressed archive files after extraction.
    - **Type:** boolean

  remove_archive_mask: |
    **remove_archive_mask** (inside download_par)

    - **Description:** If True, remove the original archive mask after creating
      the integer mask version used by SoFiA.
    - **Type:** boolean

  dryrun: |
    **dryrun** (inside download_par)

    - **Description:** If True, estimate/download-plan information is printed
      without downloading products.
    - **Type:** boolean

  print_urls: |
    **print_urls** (inside download_par)

    - **Description:** If True, print selected archive product URLs.
    - **Type:** boolean

  filename_must_include: |
    **filename_must_include** (inside download_par)

    - **Description:** List of strings that selected product filenames must
      contain. Use this to narrow archive products.
    - **Type:** list

  data_dir: |
    **data_dir** (inside download_par)

    - **Description:** Directory where downloaded products should be stored. If
      null, the ALMA client default cache location is used.
    - **Type:** string or null

  catalog_file: |
    **catalog_file** (in sip_args.yaml)

    - **Description:** SoFiA catalog file used by SIP when ESPADA cannot infer
      the current run catalog.
    - **Type:** string, list, or null

  source_id: |
    **source_id** (in sip_args.yaml)

    - **Description:** Source id or list of source ids to render. ESPADA can also
      use source lists inferred from SoFiA outputs.
    - **Type:** integer, list, or null

  output_image_file_type: |
    **output_image_file_type** (in sip_args.yaml)

    - **Description:** Output image suffix passed to SIP.
    - **Type:** string or null
    - **Accepted values:** `png`, `jpg`, `pdf`, `svg`

  spec_full_range: |
    **spec_full_range** (in sip_args.yaml)

    - **Description:** If True, request spectra over the full spectral range.
    - **Type:** boolean

  syn_beam_dimensions: |
    **syn_beam_dimensions** (in sip_args.yaml)

    - **Description:** Optional synthesized beam dimensions `[bmaj, bmin, bpa]`.
    - **Type:** list or null

  channel_width: |
    **channel_width** (in sip_args.yaml)

    - **Description:** Channel width passed to SIP when needed.
    - **Type:** float or null

  min_size: |
    **min_size** (in sip_args.yaml)

    - **Description:** Minimum image size requested from SIP.
    - **Type:** float, integer, or null

  snr_range: |
    **snr_range** (in sip_args.yaml)

    - **Description:** SNR range for plotting the lowest contour.
    - **Type:** list or null

  surveys_list: |
    **surveys_list** (in sip_args.yaml)

    - **Description:** Survey names passed to SIP for background imagery. Use
      `['none']` for offline/no-survey mode.
    - **Type:** list or null

  combo: |
    **combo** (in sip_args.yaml)

    - **Description:** Combined-image option for SIP. It may be a boolean or a
      path-like string depending on SIP usage.
    - **Type:** boolean, string, or null

  user_image: |
    **user_image** (in sip_args.yaml)

    - **Description:** User-supplied image or list of images for SIP overlays.
    - **Type:** string, list, or null

  percentile_range: |
    **percentile_range** (in sip_args.yaml)

    - **Description:** Percentile range for user-image display scaling.
    - **Type:** list or null

  spec_line: |
    **spec_line** (in sip_args.yaml)

    - **Description:** Spectral line name passed to SIP.
    - **Type:** string, list, or null
    - **Accepted values include:** `HI`, `CO(1-0)`, `CO(2-1)`, `CO(3-2)`,
      `OH_1612`, `OH_1665`, `OH_1667`, `OH_1720`

  no_source_id: |
    **no_source_id** (in sip_args.yaml)

    - **Description:** If True, request SIP output without source id labels.
    - **Type:** boolean or null

  channel_maps: |
    **channel_maps** (in sip_args.yaml)

    - **Description:** If True, request SIP channel maps.
    - **Type:** boolean or null

  spec_only: |
    **spec_only** (in sip_args.yaml)

    - **Description:** If True, request spectra only, without spatial images.
    - **Type:** boolean or null

  plot_units: |
    **plot_units** (in sip_args.yaml)

    - **Description:** If True, request SIP moment-0 plot units conversion where
      supported.
    - **Type:** boolean or null

  overwrite: |
    **overwrite** (in sip_args.yaml)

    - **Description:** If True, allow SIP to overwrite existing image products.
    - **Type:** boolean or null
